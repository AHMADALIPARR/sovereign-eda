name: release-gate

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl gcc python3 mawk
          # Why3, Yosys, Z3, nvcc, and ptxas are required by the gate.
          # Until this workflow installs them, the gate fails here by
          # design, and no release is made from a failing gate.
      - name: Run release gate
        run: sh scripts/release-gate.sh
      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log
          path: reports/test-results/gate-*.log
